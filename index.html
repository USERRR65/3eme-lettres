<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3éme Lettres 2k27</title>
    
    <!-- Google Fonts for Arabic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        maroon: {
                            800: '#38040e',
                            900: '#25020a',
                            950: '#180106',
                        },
                        gold: {
                            300: '#f3e5ab',
                            400: '#e6ca65',
                            500: '#d4af37',
                            600: '#aa8c2c',
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        amiri: ['Amiri', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom scrollbar and backdrop glows */
        body {
            background: radial-gradient(circle at center, #38040e 0%, #180106 100%);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
        }

        .gold-border-glow {
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15), inset 0 0 15px rgba(212, 175, 55, 0.05);
        }

        .gold-text-glow {
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa8c2c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Glassmorphism card */
        .maroon-card {
            background: rgba(37, 2, 10, 0.75);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="text-gray-100 flex flex-col justify-between items-center min-h-screen p-4 sm:p-6 overflow-x-hidden">

    <header class="w-full max-w-2xl text-center mt-4 mb-6">
        <div class="inline-block px-4 py-1 rounded-full border border-gold-500/30 bg-gold-500/10 mb-3">
            <span class="text-xs sm:text-sm text-gold-300 tracking-wider">الدفعة الرسمية</span>
        </div>
        <h1 class="text-4xl sm:text-6xl font-extrabold font-amiri gold-gradient-text gold-text-glow mb-2">
            شعبة الأدباء 
        </h1>
        <div class="h-0.5 w-32 mx-auto bg-gradient-to-r from-transparent via-gold-500 to-transparent my-3"></div>
        <p class="text-xs sm:text-sm text-gold-300/80">مرحباً بكم في العرض الخاص 🎬</p>
    </header>

    <main class="w-full max-w-2xl my-auto">
        <div class="maroon-card gold-border-glow rounded-2xl p-3 sm:p-5 shadow-2xl relative overflow-hidden">
            <!-- Decorative corner accents -->
            <div class="absolute top-0 right-0 w-8 h-8 border-t-2 border-r-2 border-gold-500 rounded-tr-2xl"></div>
            <div class="absolute bottom-0 left-0 w-8 h-8 border-b-2 border-l-2 border-gold-500 rounded-bl-2xl"></div>
            
            <!-- Video Container -->
            <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-black/60 shadow-inner group">
                <video id="clashVideo" class="w-full h-full object-cover" controls playsinline poster="https://placehold.co/1280x720/25020a/d4af37?text=%D8%B4%D8%B9%D8%A8%D8%A9+%D8%A7%D9%84%D8%A3%D8%AF%D8%A8%D8%A7%D8%A1+3">
                    <!-- Replace the src below with your actual video link (Direct MP4 URL) -->
                    <source src="WhatsApp Video 2026-10-05 at 12.13.43 PM.mp4" type="video/mp4">
             
                </video>
            </div>

            <div class="mt-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs sm:text-sm text-gold-300/90 px-2">
                <div class="flex items-center space-x-2 space-x-reverse">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                
                </div>
                
                <div class="flex items-center space-x-2 space-x-reverse text-gold-400">
                    <button onclick="toggleMute()" class="px-3 py-1.5 rounded-lg bg-maroon-800/80 border border-gold-500/30 hover:border-gold-500 transition-all flex items-center gap-1.5 active:scale-95">
                        <svg id="muteIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current text-gold-400" viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                        </svg>
                        <span id="muteText">Sound</span>
                    </button>

                    <button onclick="toggleFullscreen()" class="px-3 py-1.5 rounded-lg bg-maroon-800/80 border border-gold-500/30 hover:border-gold-500 transition-all flex items-center gap-1.5 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 fill-current text-gold-400" viewBox="0 0 24 24">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                        <span>Fullscreen</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-2xl text-center mt-6 mb-2">
        <p class="text-xs text-gold-500/60 font-mono">
            3éme Lettres
        </p>
    </footer>

    <script>
        const video = document.getElementById('clashVideo');
        const muteText = document.getElementById('muteText');

        // Mute / Unmute Toggle
        function toggleMute() {
            if (video) {
                video.muted = !video.muted;
                muteText.textContent = video.muted ? 'Unmute' :'Mute';
            }
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            if (!video) return;
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) { /* Safari / iOS */
                video.webkitRequestFullscreen();
            } else if (video.msRequestFullscreen) {
                video.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
